# WebSocket connection-header helper for the Directus reverse proxy.
#
# Must be loaded in nginx's `http {}` context, NOT inside a server/location
# block. On Debian/Ubuntu, symlink or copy this file into /etc/nginx/conf.d/
# (which nginx.conf includes at http scope):
#
#   sudo ln -s \
#     /home/amani-mavu/Projects/work/golden-tie-cms/directus/deploy/nginx/map-upgrade.conf \
#     /etc/nginx/conf.d/map-upgrade.conf
#
# It sets $connection_upgrade based on the request's Upgrade header:
#   - Upgrade header present (WebSocket handshake) -> "upgrade"
#   - no Upgrade header (normal HTTP request)      -> "close"
#
# Referenced in goldetiecms.conf as:
#   proxy_set_header Connection $connection_upgrade;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
